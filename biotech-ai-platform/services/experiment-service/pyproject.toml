[tool.poetry]
name = "experiment-service"
version = "0.1.0"
description = "Experiment Service for BioTech AI Platform"
authors = ["Your Name <you@example.com>"] # Placeholder
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
pydantic = "^2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
ruff = "^0.4.0"
black = "^24.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I", "UP", "PL", "PT"]
ignore = []

[tool.black]
line-length = 88
