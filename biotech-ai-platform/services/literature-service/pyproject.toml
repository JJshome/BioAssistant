[tool.poetry]
name = "literature-service"
version = "0.1.0"
description = "Literature Search Service for BioTech AI Platform"
authors = ["Your Name <you@example.com>"] # Placeholder
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.110.0" # Check latest version
uvicorn = {extras = ["standard"], version = "^0.29.0"} # Check latest version
pydantic = "^2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
ruff = "^0.4.0" # Check latest version
black = "^24.0.0" # Check latest version

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I", "UP", "PL", "PT"] # Example selection
ignore = []

[tool.black]
line-length = 88
